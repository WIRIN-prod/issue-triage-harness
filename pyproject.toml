[project]
name = "issue-triage-harness"
version = "0.1.0"
description = "LLM issue triage service and the evaluation harness that measures it"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage", "src/graph", "src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
