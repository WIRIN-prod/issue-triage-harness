[project]
name = "issue-triage-harness"
version = "0.1.0"
description = "LLM issue triage service and the evaluation harness that measures it"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # Typed model calls with structured output. `-slim` plus the openai extra is all we
    # need: OpenRouter is OpenAI-compatible, so no other provider package is pulled in.
    "pydantic-ai-slim[openai]>=2.0",
    # GenAI semantic conventions for token/cost/latency telemetry (DECISIONS.md D11).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage", "src/graph", "src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
