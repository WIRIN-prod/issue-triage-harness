name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv pip install --system -e ".[dev]"

      # No credentials and no network: all 67 tests run offline, deliberately.
      # Tests that would need a key or an API skip themselves.
      - name: Test
        run: pytest -q
