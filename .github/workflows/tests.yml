name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Deliberately the same two commands the README gives a reader, into a venv.
      # `uv pip install --system` fails on ubuntu-latest: its Python is externally
      # managed (PEP 668) and refuses system-wide installs. Mirroring the documented
      # path also means CI verifies the install instructions, not just the code.
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # No credentials and no network: the suite is offline by design, and the few
      # tests needing a key skip themselves.
      - name: Test
        run: uv run pytest -q
